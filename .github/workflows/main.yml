- name: Build APK in official P4A container
  env:
    ANDROID_API: 33         # Целевая версия API
    ANDROID_MINAPI: 24      # Минимальная поддерживаемая версия
    DIST_NAME: passgen      # Название дистрибутива из spec-файла
    REQUIRES: python3,kivy  # Зависимости из spec-файла
    BOOTSTRAP: sdl2         # Бутстреп из spec-файла
    ARCHS: arm64-v8a,armeabi-v7a,x86_64 # Архитектуры (можно убрать x86_64)
  run: |
    # Создаем папку для сохранения результатов ИЗМЕНЯЕМ ПОРЯДОК!
    mkdir -p artifacts          # <--- ЭТО ДОЛЖНО БЫТЬ ПЕРВОЙ КОМАНДОЙ
    
    # Меняем владельца папки на пользователя runner (это важно!)
    sudo chown runner:runner ./artifacts 

    # Собираем контейнером
    docker run --rm \
      -v ${GITHUB_WORKSPACE}:/home/user/app \ # <-- Эта строка уже есть
      -v ${GITHUB_WORKSPACE}/artifacts:/home/user/app/artifacts \ # <--- ДОБАВЬТЕ ЭТУ СТРОКУ
      kivy/p4a-buildozer:python3.11-kivy2.3.0 \
        ./toolchain.py create --debug

    cp -r .buildozer/android/platform/build-*/*/dists/${DIST_NAME}/bin/*.apk artifacts/
