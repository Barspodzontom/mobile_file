name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest # Можно оставить latest, теперь это не важно!
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Очистка кэша от прошлых запусков
      - name: Clean previous build
        run: |
          rm -rf .buildozer bin dist

      # Установка зависимостей только для работы с Git и Docker
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y git docker.io

      # Запуск официальной среды python-for-android внутри контейнера
      - name: Build APK in official P4A container
        env:
          ANDROID_API: 33         # Целевая версия API
          ANDROID_MINAPI: 24      # Минимальная поддерживаемая версия
          DIST_NAME: passgen      # Название дистрибутива из spec-файла
          REQUIRES: python3,kivy  # Зависимости из spec-файла
          BOOTSTRAP: sdl2         # Бутстреп из spec-файла
          ARCHS: arm64-v8a,armeabi-v7a,x86_64 # Архитектуры (можно убрать x86_64)
        run: |-
          # Создаем папку для сохранения результатов
          mkdir -p artifacts

          # Собираем контейнером
          docker run --rm \
            -e PACKAGES_PATH=/packages \
            -e ANDROIDSDK=/android-sdk \
            -e 
